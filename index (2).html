<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}

<script>window.TE_PWA=true;</script>
<title>Te Engrena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --surface2:#E6EAE5; --ink:#16201C; --muted:#5B6760; --line:#D3DAD4;
  --fis:#D2522A; --men:#2B64A5; --esp:#A07A22; --good:#2A8653; --bad:#BD3A2C;
  --fis-soft:#F8E3DA; --men-soft:#DDE7F3; --esp-soft:#F2EAD6; --good-soft:#DCEFE3;
  --cx0:#2B64A5; --cx1:#2A8653; --cx2:#C0762A; --cx3:#7A4FB0; --cx4:#1F8A8A; --cx5:#B0457A;
  --hab:#5046C8; --ag:#B83A6B; --nota:#4E7A2A;
  --in:#2A8653; --out:#C8402F; --save:#1B8A87; --card:#6B48B0; --parc:#B8781A;
  --cc0:#C8402F; --cc1:#D9772B; --cc2:#B8901A; --cc3:#2F8F4E; --cc4:#1B8A87; --cc5:#2B64A5; --cc6:#4B53B8; --cc7:#8A48B0; --cc8:#C0457E; --cc9:#8A5A3B; --cc10:#5A6B7B; --cc11:#7A807C;
  --cc12:#A3262E; --cc13:#E8664A; --cc14:#6E9A1E; --cc15:#7A7A1E; --cc16:#2BA37F; --cc17:#2A8FC9; --cc18:#253E8C; --cc19:#6A3FC9; --cc20:#B02FA0; --cc21:#D64F7A; --cc22:#B08A55; --cc23:#3F4648;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 4px 14px rgba(22,32,28,.06);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#161D1A; --surface2:#1F2824; --ink:#E7ECE9; --muted:#95A29B; --line:#2A3530;
    --fis:#F07346; --men:#629BDB; --esp:#D6AE4B; --good:#50C386; --bad:#E7695A;
    --fis-soft:#3A2119; --men-soft:#1A2838; --esp-soft:#332A15; --good-soft:#16301F;
    --cx0:#629BDB; --cx1:#50C386; --cx2:#E39A4F; --cx3:#A883DB; --cx4:#4DBABA; --cx5:#DB76A6;
    --hab:#9690F2; --ag:#E57BA3; --nota:#93C46E;
    --in:#50C386; --out:#EC7462; --save:#4CC2BE; --card:#A58AE0; --parc:#E3A64A;
    --cc0:#EC7462; --cc1:#F0A05A; --cc2:#E0BE4A; --cc3:#5CC983; --cc4:#4CC2BE; --cc5:#6A9FDD; --cc6:#8990E6; --cc7:#B784DB; --cc8:#E27CAD; --cc9:#C08D6B; --cc10:#93A3B3; --cc11:#A7ADA9;
    --cc12:#E2605F; --cc13:#F08A72; --cc14:#A5CF4F; --cc15:#BDBD52; --cc16:#5ED3AE; --cc17:#63B9EA; --cc18:#7186D6; --cc19:#A487EE; --cc20:#DE6FD0; --cc21:#EC86A6; --cc22:#D7B88A; --cc23:#8C9598;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#161D1A; --surface2:#1F2824; --ink:#E7ECE9; --muted:#95A29B; --line:#2A3530;
  --fis:#F07346; --men:#629BDB; --esp:#D6AE4B; --good:#50C386; --bad:#E7695A;
  --fis-soft:#3A2119; --men-soft:#1A2838; --esp-soft:#332A15; --good-soft:#16301F;
    --cx0:#629BDB; --cx1:#50C386; --cx2:#E39A4F; --cx3:#A883DB; --cx4:#4DBABA; --cx5:#DB76A6;
    --hab:#9690F2; --ag:#E57BA3; --nota:#93C46E;
    --in:#50C386; --out:#EC7462; --save:#4CC2BE; --card:#A58AE0; --parc:#E3A64A;
    --cc0:#EC7462; --cc1:#F0A05A; --cc2:#E0BE4A; --cc3:#5CC983; --cc4:#4CC2BE; --cc5:#6A9FDD; --cc6:#8990E6; --cc7:#B784DB; --cc8:#E27CAD; --cc9:#C08D6B; --cc10:#93A3B3; --cc11:#A7ADA9;
    --cc12:#E2605F; --cc13:#F08A72; --cc14:#A5CF4F; --cc15:#BDBD52; --cc16:#5ED3AE; --cc17:#63B9EA; --cc18:#7186D6; --cc19:#A487EE; --cc20:#DE6FD0; --cc21:#EC86A6; --cc22:#D7B88A; --cc23:#8C9598;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:28px;height:28px}
.brand b{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.sync{white-space:nowrap;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:6px 0 2px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.pillar{border-top:4px solid var(--c)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c,var(--muted))}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--c,var(--ink));color:#fff}
:root[data-theme="dark"] .btn.primary{color:#101513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#101513}}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.block{width:100%;display:block;text-align:center}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c,var(--men));outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
:root[data-theme="dark"] .chip.on{color:#101513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#101513}}
.chip .today{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:5px;vertical-align:middle}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{border:none;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--c,var(--ink));box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.item:first-child{border-top:none;padding-top:2px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.fis{background:var(--fis-soft);color:var(--fis)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.men{background:var(--men-soft);color:var(--men)}
.tag.esp{background:var(--esp-soft);color:var(--esp)}
.kind{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--c)}
.kind svg{width:20px;height:20px}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent}
.check.on{background:var(--c);border-color:var(--c);color:#fff}
.check svg{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{white-space:nowrap;letter-spacing:-.02em;font-family:var(--display);font-weight:800;font-size:clamp(13px,3.6vw,21px);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.cat{display:flex;flex-direction:column;gap:5px;padding-block:8px}
.days7{display:flex;gap:4px}
.days7 span{width:9px;height:9px;border-radius:3px;background:var(--surface2)}
.days7 span.on{background:var(--c)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.banner{background:var(--fis-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.verse{border-left:3px solid var(--esp);padding-left:12px}
.verse .ref{font-family:var(--display);font-weight:600}
.verse q{display:block;font-style:italic;margin-block:4px}
.verse q::before,.verse q::after{content:""}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea.in{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center}
.setrow input{padding:8px 10px}
.exblock{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.exname{border:none;background:none;font-weight:700;font-size:16px;padding:0;width:100%;color:var(--ink)}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
nav.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;white-space:nowrap;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
nav.nav button svg{width:22px;height:22px}
nav.nav button.on{color:var(--c)}
.sheetwrap{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.big{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.1;margin-block:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stackbar{display:flex;gap:2px;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-top:14px}
.stackbar i{display:block;height:100%}
.janelas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.janela{text-align:left;background:var(--surface);border:none;border-top:4px solid var(--k);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--ink);min-width:0}
.janela:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.janela .jn{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.janela .jv{font-family:var(--display);font-weight:800;font-size:clamp(17px,5vw,22px);letter-spacing:-.01em;overflow-wrap:anywhere}
.janela .bar i{background:var(--k)}
.dvrow{display:grid;grid-template-columns:8px minmax(0,1fr) 108px auto;gap:8px;align-items:center}
.dvrow .sw{width:8px;height:34px;border-radius:4px;background:var(--k)}
.dvrow .in{padding:8px 10px}
.dvinfo{background:var(--surface2);border-radius:10px;padding:10px 12px;font-weight:600}
.dvinfo.over{color:var(--bad)}
.dvinfo.done{color:var(--good);background:var(--good-soft)}
.seg.segfin button{font-size:13px;padding:8px 2px}
.sav{--c:var(--save)} .prc{--c:var(--parc)} .crd{--c:var(--card)} .out{--c:var(--out)} .inn{--c:var(--in)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .cdot{margin-right:6px;vertical-align:-1px}
.chip.on .cdot{background:currentColor}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);font-family:var(--display);font-weight:800;font-size:16px}
.item.tap{cursor:pointer}
.stattap{text-align:left;background:none;border:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.guardmes{display:block;width:100%;text-align:left;margin-top:12px;padding:9px 12px;border:none;border-radius:10px;background:color-mix(in srgb,var(--save) 12%,var(--surface));color:var(--save);font:inherit;font-size:13px;cursor:pointer}
.guardmes b{font-variant-numeric:tabular-nums}
.stattap .edit{color:var(--in);font-weight:700}
.stattap:focus-visible{outline:2px solid var(--in);outline-offset:3px;border-radius:6px}
.item.quit{opacity:.6}
.tag.prct{background:color-mix(in srgb,var(--parc) 16%,var(--surface));color:var(--parc)}
.tag.up{background:color-mix(in srgb,var(--out) 14%,var(--surface));color:var(--out)}
.tag.down{background:var(--good-soft);color:var(--good)}
.card.dia{padding-block:12px 6px}
.diahead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.diahead + .item{border-top:none}
.atalhos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.atalho{text-align:left;background:var(--surface);border:none;border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;cursor:pointer;color:var(--ink);min-width:0}
.atalho .l{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.atalho .v{font-family:var(--display);font-weight:800;font-size:clamp(17px,5vw,21px);overflow-wrap:anywhere}
.atalho:focus-visible,.cartao:focus-visible,.cor:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.mbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;margin-block:8px 4px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mcol{height:72px;width:100%;max-width:34px;background:var(--surface2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.mcol i{display:block;width:100%;background:var(--c);border-radius:6px 6px 0 0}
.mv{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.ml{font-size:11.5px;color:var(--muted)}
.livre{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--parc) 13%,var(--surface));font-size:14px}
.cartao{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid color-mix(in srgb,var(--card) 25%,var(--line));background:color-mix(in srgb,var(--card) 7%,var(--surface));border-radius:14px;padding:14px;cursor:pointer;color:var(--ink)}
.cartao b:first-child{color:var(--card)}
.cartao .jv{font-family:var(--display);font-weight:800;font-size:22px}
.bar2{display:flex;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--card)}
.bar2 i.fut{background:color-mix(in srgb,var(--card) 40%,var(--surface2))}
.cores{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:4px}
.corlivre{position:relative;display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);font-weight:700;font-size:14px}
.corlivre.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.corlivre input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}
.corprev{width:30px;height:30px;border-radius:9px;flex:none;background:var(--c)}
.corrow{width:100%;background:none;border:none;border-top:1px solid var(--line);text-align:left;color:var(--ink);font:inherit;padding-inline:0}
.corrow .sw{width:26px;height:26px;border-radius:8px;flex:none}
.pagto{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--in) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--in) 30%,var(--line));cursor:pointer}
.pagto input{width:22px;height:22px;accent-color:var(--in);flex:none;margin:1px 0 0}
.pagto .small{display:block;font-weight:500;margin-top:2px}
.orcdia{margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--men) 10%,var(--surface))}
.iconbtn:disabled{opacity:.3;cursor:default}
.cor{aspect-ratio:1;max-width:100%;border-radius:10px;border:3px solid var(--surface);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.cor.on{box-shadow:0 0 0 2px var(--c)}
.nota{--c:var(--nota)}
.card.aviso{background:color-mix(in srgb,var(--men) 9%,var(--surface));box-shadow:none;border:1px solid color-mix(in srgb,var(--men) 25%,var(--line))}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.area{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer}
.area svg{width:22px;height:22px}
.area.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.area:focus-visible,.notacard:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.notas{display:flex;flex-direction:column;gap:10px}
button.notacard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;width:100%;background:var(--surface);border:none;border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit}
.notacard .ntit{font-weight:700;font-size:15.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.notacard .ntxt{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.notacard .pin{color:var(--nota)}
.hab{--c:var(--hab);--soft:color-mix(in srgb,var(--hab) 14%,var(--surface))}
.ag{--c:var(--ag);--soft:color-mix(in srgb,var(--ag) 14%,var(--surface))}
.check:disabled{opacity:.3;cursor:default}
.evok .t{text-decoration:line-through;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal-d{aspect-ratio:1/1.05;max-width:100%;border:none;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);font-size:14.5px;font-weight:600;padding:0}
.cal-d:hover{background:var(--surface2)}
.cal-d.hj{color:var(--ag);box-shadow:inset 0 0 0 1.5px var(--ag)}
.cal-d.sel{background:var(--ag);color:#fff;box-shadow:none}
:root[data-theme="dark"] .cal-d.sel{color:#101513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal-d.sel{color:#101513}}
.cal-d .dots{display:flex;gap:2px;height:5px}
.cal-d .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal-d.sel .dots i{background:currentColor!important}
.cal-d:focus-visible,.hgc:focus-visible,.treinotit:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.habgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.hgh{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);font-weight:700;line-height:1.2}
.hgh b{font-size:12px;color:var(--ink)}
.hgh.hj,.hgh.hj b{color:var(--hab)}
.hgn{grid-column:1/-1;font-size:13.5px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.hgc{width:100%;height:30px;border-radius:8px;border:none;background:var(--surface2);cursor:pointer;padding:0}
.hgc.on{background:var(--c)}
.hgc.off{opacity:.3;cursor:default}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat .hl{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.heat .hc{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface2)}
.heat .hc.on{background:var(--c)}
.heat .hc.off{opacity:.35}
.heat .hc.hj{box-shadow:inset 0 0 0 2px var(--ink)}
.semhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.semdia.hojec{box-shadow:0 0 0 2px var(--fis),var(--shadow)}
.treino{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.treinotit{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.exlist{list-style:none;margin:10px 0 0;padding:0 0 0 48px;display:flex;flex-direction:column}
.exlist li{display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:1px dashed var(--line);font-size:14px}
.exlist li:last-child{border-bottom:none}
.exlist .exn{color:var(--fis);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.fis{--c:var(--fis);--soft:var(--fis-soft)}
.men{--c:var(--men);--soft:var(--men-soft)}
.esp{--c:var(--esp);--soft:var(--esp-soft)}
/* indicador deslizante das sub-abas */
.segx{position:relative}
.segx button{position:relative;z-index:1;background:none!important;box-shadow:none!important;transition:color .2s}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px - (var(--n) - 1) * 3px) / var(--n));background:var(--surface);border-radius:9px;box-shadow:var(--shadow);transform:translateX(calc(var(--para) * (100% + 3px)))}
@media (prefers-reduced-motion: no-preference){
  .sheetwrap{animation:fundo .2s ease-out}
  .sheet{animation:up .3s cubic-bezier(.2,.9,.25,1.05)}
  .sheetwrap.saindo{animation:fundoSai .19s ease-in forwards}
  .sheetwrap.saindo .sheet{animation:desce .19s ease-in forwards}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @keyframes desce{to{transform:translateY(100%)}}
  @keyframes fundo{from{background:rgba(10,14,12,0)}}
  @keyframes fundoSai{to{background:rgba(10,14,12,0)}}
  .toast{animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}}
  .seg-ind{animation:desliza .32s cubic-bezier(.3,.9,.3,1.1)}
  @keyframes desliza{from{transform:translateX(calc(var(--de) * (100% + 3px)))}to{transform:translateX(calc(var(--para) * (100% + 3px)))}}
  .tela.entra-dir{animation:daDir .3s cubic-bezier(.2,.8,.3,1)}
  .tela.entra-esq{animation:daEsq .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes daDir{from{opacity:.2;transform:translateX(28px)}}
  @keyframes daEsq{from{opacity:.2;transform:translateX(-28px)}}
  .tela.entra-dir .stack>*,.tela.entra-esq .stack>*,.tela.entra-sub .stack>*{animation:sobe .36s cubic-bezier(.2,.8,.3,1) both}
  .tela .stack>*:nth-child(2){animation-delay:.04s}
  .tela .stack>*:nth-child(3){animation-delay:.08s}
  .tela .stack>*:nth-child(4){animation-delay:.12s}
  .tela .stack>*:nth-child(5){animation-delay:.16s}
  .tela .stack>*:nth-child(n+6){animation-delay:.2s}
  @keyframes sobe{from{opacity:.15;transform:translateY(12px)}}
  .tela.entra-dir .bar i,.tela.entra-esq .bar i,.tela.entra-sub .bar i,.tela.entra-dir .bar2 i,.tela.entra-sub .bar2 i,.tela.entra-dir .mcol i,.tela.entra-sub .mcol i{animation:cresce .6s cubic-bezier(.2,.8,.3,1) .1s both}
  .tela.entra-dir .mcol i,.tela.entra-sub .mcol i{transform-origin:bottom;animation-name:cresceV}
  .bar i,.bar2 i{transform-origin:left}
  @keyframes cresce{from{transform:scaleX(0)}}
  @keyframes cresceV{from{transform:scaleY(0)}}
  nav.nav button.pula svg{animation:pula .42s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pula{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .pop{animation:pop .34s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .check.on.pop svg{animation:risca .3s ease-out}
  @keyframes risca{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
  /* toque */
  .btn,.chip,.check,.iconbtn,.janela,.atalho,.area,.cal-d,.notacard,.cartao,.hgc,.cor,.stattap,.guardmes,nav.nav button,.seg button,.treinotit,.item.tap{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,box-shadow .2s,color .2s,border-color .2s}
  .btn:active,.chip:active,.iconbtn:active,.cor:active,.seg button:active{transform:scale(.95)}
  .check:active,.hgc:active,.cal-d:active{transform:scale(.88)}
  .janela:active,.atalho:active,.area:active,.notacard:active,.cartao:active,.stattap:active,.guardmes:active{transform:scale(.97)}
  nav.nav button:active svg{transform:scale(.85)}
  nav.nav button svg{transition:transform .14s}
  .item.tap:active,.treinotit:active{transform:scale(.985)}
}
</style>

<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const ICON={
 mente:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
 nota:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5h9l4 4v13h-13z"/><path d="M14.5 3.5v4h4M8.5 12h7M8.5 16h4.5"/></svg>',
 casa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z"/></svg>',
 hab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>',
 hoje:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 fis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
 men:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
 esp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 3 5 4.5 5 8.5a5 5 0 0 1-10 0C7 7.5 10 6 12 3z"/><path d="M12 21v-4"/></svg>',
 musc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
 corrida:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14.5" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v5M6 11l3-3 4 1 2 3 3 1M11 15l1.5-5"/></svg>',
 natacao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17c2 0 2-1.5 4-1.5S8 17 10 17s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M2 21c2 0 2-1.5 4-1.5S8 21 10 21s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><circle cx="16" cy="7" r="1.8"/><path d="M5 13l5-4 3 3"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke-width="3.2" stroke-linecap="round"><path d="M16 4a12 12 0 0 1 10.4 6" stroke="var(--esp)"/><path d="M26.4 22A12 12 0 0 1 5.6 22" stroke="var(--men)"/><path d="M5.6 22A12 12 0 0 1 16 4" stroke="var(--fis)" transform="rotate(0)"/></g><circle cx="16" cy="16" r="4.2" fill="var(--ink)"/></svg>';
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DIAS_LONGO=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const TIPOS={musc:"Musculação",corrida:"Corrida",natacao:"Natação"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>ymd(new Date());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const ddmm=s=>{const [y,m,d]=s.split("-");return d+"/"+m};
const addDias=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const brlF=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl=v=>brlF.format(v||0);
const numF=v=>(Math.round(v*10)/10).toLocaleString("pt-BR");
function parseNum(s){s=String(s||"").trim().replace(/\s|R\$/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)}
function parseTempo(s){s=String(s||"").trim();if(!s)return NaN;const p=s.split(":").map(x=>parseFloat(x.replace(",",".")));if(p.some(isNaN))return NaN;if(p.length===1)return p[0]*60;if(p.length===2)return p[0]*60+p[1];return p[0]*3600+p[1]*60+p[2]}
function fmtTempo(sec){if(!isFinite(sec))return"–";sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+":"+pad(m)+":"+pad(s):m+":"+pad(s)}
const mesDe=s=>s.slice(0,7);
const nomeMes=ym=>{const [y,m]=ym.split("-").map(Number);return MESES[m-1]+" "+y};

/* ---------- estado ---------- */
const KEY="teengrena-v1";
const PARTS=["fisico","financas","espiritual","rotina"];
function exemploPlano(){
  const m=(t,ex)=>({id:uid(),tipo:"musc",titulo:t,exercicios:ex.map(([nome,series,reps])=>({id:uid(),nome,series,reps}))});
  return {
    1:[m("Peito e tríceps",[["Supino reto",4,"10"],["Supino inclinado halteres",3,"12"],["Crucifixo",3,"12"],["Tríceps corda",3,"12"]])],
    2:[{id:uid(),tipo:"corrida",titulo:"Corrida leve",alvo:"5 km em ritmo confortável"}],
    3:[m("Costas e bíceps",[["Puxada frente",4,"10"],["Remada baixa",3,"12"],["Rosca direta",3,"10"]])],
    4:[{id:uid(),tipo:"natacao",titulo:"Natação técnica",alvo:"1000 m, séries de 100 m"}],
    5:[m("Pernas",[["Agachamento livre",4,"8"],["Leg press",3,"12"],["Cadeira extensora",3,"12"],["Stiff",3,"10"]])],
    6:[{id:uid(),tipo:"corrida",titulo:"Longão",alvo:"8 km"}],
    0:[]
  };
}
function padrao(){
  return {
    fisico:{updatedAt:0,exemplo:true,plano:exemploPlano(),logs:[]},
    financas:{updatedAt:0,entradas:[],gastos:[],categorias:["Fixos","Alimentação","Lazer","Carro","Saúde","Casa","Outros"],cartoes:[],fixos:[],caixinhas:[],movs:[],parcelas:[],catCores:{}},
    espiritual:{updatedAt:0,gratidao:[],versiculos:[],metas:[]},
    rotina:{updatedAt:0,habitos:[],eventos:[],notas:[],aparencia:{tema:"auto",cores:{}}}
  };
}
function normaliza(p,v){const d=padrao()[p];const o=Object.assign({},d,v||{});for(const k in d){if(Array.isArray(d[k])&&!Array.isArray(o[k]))o[k]=d[k]}if(p==="fisico"&&(typeof o.plano!=="object"||!o.plano))o.plano={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};if(p==="fisico")for(let i=0;i<7;i++)if(!Array.isArray(o.plano[i]))o.plano[i]=[];if(p==="financas")migraFin(o);return o}
const CC_N=24;
function corVar(c){return typeof c==="string"&&c[0]==="#"?c:"var(--cc"+(c!=null&&c!==""?c:11)+")"}const CAT_COR_PADRAO={"Fixos":10,"Alimentação":1,"Lazer":7,"Carro":0,"Saúde":3,"Casa":9,"Outros":11};
function proxCor(us){for(let i=0;i<CC_N;i++)if(!us.includes(i))return i;return us.length%CC_N}
function migraFin(o){o.cartoes=(o.cartoes||[]).map(c=>typeof c==="string"?{id:uid(),nome:c,limite:0,faturas:{}}:Object.assign({limite:0},c,{faturas:(c&&typeof c.faturas==="object"&&c.faturas)||{}}));if(!o.catCores||typeof o.catCores!=="object")o.catCores={};o.categorias.forEach(c=>{if(o.catCores[c]==null)o.catCores[c]=CAT_COR_PADRAO[c]!=null?CAT_COR_PADRAO[c]:proxCor(Object.values(o.catCores))});return o}
let S=padrao();migraFin(S.financas);
try{const raw=localStorage.getItem(KEY);if(raw){const j=JSON.parse(raw);PARTS.forEach(p=>{if(j[p])S[p]=normaliza(p,j[p])})}}catch(e){}
if(S.rotina.nome==null&&(S.fisico.updatedAt||S.financas.updatedAt||S.espiritual.updatedAt))S.rotina.nome="Gabriel";
const PWA=!!window.TE_PWA;
function standalone(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let promptInstalar=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptInstalar=e;try{render()}catch(_){}});
window.addEventListener("appinstalled",()=>{promptInstalar=null;try{render()}catch(_){}});
function lerLS(k){try{return localStorage.getItem(k)}catch(e){return null}}
function gravarLS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function temDados(){return !!(S.financas.gastos.length||S.financas.entradas.length||S.fisico.logs.length||S.rotina.notas.length||S.rotina.eventos.length||S.espiritual.versiculos.length||S.espiritual.gratidao.length)}
function diasDesdeCopia(){const d=lerLS(KEY+"-ultimaCopia");return d?difDias(d,hoje()):999}
function marcarCopia(){gravarLS(KEY+"-ultimaCopia",hoje())}
function avisosPWA(){
  if(!PWA)return "";let out="";
  if(!standalone()&&lerLS(KEY+"-semInstalar")!==hoje()){
    const como=IOS?'No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>"Adicionar à Tela de Início"</b>.':promptInstalar?'':'No Chrome, toque em <b>⋮</b> e depois em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.';
    out+='<section class="card aviso"><b>Instale o Te Engrena no celular</b><p class="small" style="margin:4px 0 10px">Ele ganha ícone no menu e funciona sem internet. '+como+'</p><div class="row" style="gap:8px">'+(promptInstalar?'<button class="btn sm primary" data-act="instalar">Instalar</button>':'')+'<button class="btn sm ghost" data-act="semInstalar">Agora não</button></div></section>';
  }
  if(temDados()&&diasDesdeCopia()>=7)out+='<section class="card aviso"><b>Faça uma cópia de segurança</b><p class="small" style="margin:4px 0 10px">Seus dados ficam só neste celular. '+(diasDesdeCopia()>=999?'Você ainda não fez nenhuma cópia.':'A última foi há '+diasDesdeCopia()+' dias.')+'</p><button class="btn sm primary" data-act="ajustes">Fazer cópia agora</button></section>';
  return out;
}
function gravaLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function salvar(p){S[p].updatedAt=Date.now();gravaLocal();agendaSync(p);render()}

try{const u=JSON.parse(localStorage.getItem(KEY+"-ui")||"null");if(u){UI.lastCat=u.lastCat;UI.lastPag=u.lastPag;UI.tab=u.tab||UI.tab;UI.mentArea=u.mentArea||(u.tab==='habitos'?'hab':'fin');if(UI.tab==='financas'||UI.tab==='habitos')UI.tab='mental';UI.fisTab=u.fisTab||UI.fisTab;UI.finTab=u.finTab||UI.finTab;UI.espTab=u.espTab||UI.espTab}}catch(e){}

/* ---------- sincronização com a conta ---------- */
let DB=null,USER=null,syncTxt="No aparelho",syncOk=false;const timers={};
const docPath=p=>"data/users/"+USER+"/"+p;
function agendaSync(p){if(!DB)return;clearTimeout(timers[p]);timers[p]=setTimeout(()=>envia(p),1200)}
async function envia(p,tent){
  try{await DB.doc(docPath(p)).set({updatedAt:S[p].updatedAt,payload:JSON.parse(JSON.stringify(S[p]))});syncTxt="Sincronizado";syncOk=true}
  catch(e){if(e&&e.code==="unavailable"&&!tent){setTimeout(()=>envia(p,1),1500+Math.random()*1500);return}syncTxt="No aparelho";syncOk=false}
  pintaSync();
}
function pintaSync(){const el=document.getElementById("sync");if(PWA){if(el)el.hidden=true;return}if(el)el.innerHTML='<span class="dot'+(syncOk?" ok":"")+'"></span>'+esc(syncTxt)}
async function iniciaSync(){
  try{
    const c=window.claude;if(!c||typeof c.use!=="function")return;
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;USER=id;let mudou=false;
    for(const p of PARTS){
      try{
        const snap=await DB.doc(docPath(p)).get();
        const r=snap.exists?snap.data():null;
        if(r&&r.payload&&(r.updatedAt||0)>(S[p].updatedAt||0)){S[p]=normaliza(p,JSON.parse(JSON.stringify(r.payload)));mudou=true}
        else if(S[p].updatedAt&&(!r||(r.updatedAt||0)<S[p].updatedAt)){await envia(p)}
      }catch(e){}
    }
    syncTxt="Sincronizado";syncOk=true;
    if(mudou){gravaLocal();render()}else pintaSync();
  }catch(e){}
}

/* ---------- lógica física ---------- */
const planoDe=d=>S.fisico.plano[d]||[];
const logsOrdenados=()=>S.fisico.logs.slice().sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(b.criado||0)-(a.criado||0));
const logDoItem=(itemId,data)=>S.fisico.logs.find(l=>l.planoId===itemId&&l.data===data);
function ultimasSeries(nome){const n=nome.trim().toLowerCase();for(const l of logsOrdenados()){if(l.tipo!=="musc")continue;const e=(l.exercicios||[]).find(x=>x.nome.trim().toLowerCase()===n);if(e&&e.sets&&e.sets.length)return e.sets}return null}
function maxKg(e){return Math.max(0,...(e.sets||[]).map(s=>+s.kg||0))}
function historicoEx(nome){const n=nome.trim().toLowerCase();const out=[];S.fisico.logs.forEach(l=>{if(l.tipo!=="musc")return;(l.exercicios||[]).forEach(e=>{if(e.nome.trim().toLowerCase()===n&&e.sets&&e.sets.length){const vol=e.sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);out.push({data:l.data,max:maxKg(e),vol,sets:e.sets})}})});return out.sort((a,b)=>a.data<b.data?-1:1)}
function exerciciosConhecidos(){const m=new Map();S.fisico.logs.forEach(l=>{if(l.tipo==="musc")(l.exercicios||[]).forEach(e=>{if(e.sets&&e.sets.length)m.set(e.nome.trim().toLowerCase(),e.nome.trim())})});return [...m.values()].sort((a,b)=>a.localeCompare(b,"pt-BR"))}
function ritmo(l){if(!l.dist||!l.tempo)return NaN;return l.tipo==="corrida"?l.tempo/l.dist:l.tempo/(l.dist/100)}
function ritmoTxt(l){const r=ritmo(l);if(!isFinite(r))return"";return fmtTempo(r)+(l.tipo==="corrida"?" /km":" /100 m")}
function resumoLog(l){
  if(l.tipo==="musc"){const n=(l.exercicios||[]).filter(e=>e.sets&&e.sets.length).length;const s=(l.exercicios||[]).reduce((a,e)=>a+(e.sets||[]).length,0);return n+" exercícios · "+s+" séries"}
  const d=l.tipo==="corrida"?numF(l.dist)+" km":Math.round(l.dist)+" m";return d+" · "+fmtTempo(l.tempo)+(ritmoTxt(l)?" · "+ritmoTxt(l):"")
}
function parseExercicios(txt){return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s\-–:]+(\d+)\s*[xX×]\s*([\d\-–a ]+)$/);return m?{id:uid(),nome:m[1].trim(),series:+m[2],reps:m[3].trim()}:{id:uid(),nome:l,series:3,reps:""}})}

/* ---------- lógica espiritual ---------- */
function seguidos(n){return n+(n===1?' dia seguido':' dias seguidos')}
function sequencia(m){let d=hoje();if(!m.feitos[d])d=addDias(d,-1);let n=0;while(m.feitos[d]){n++;d=addDias(d,-1)}return n}

/* ---------- lógica finanças ---------- */
function formasPag(){return ["Pix","Débito","Dinheiro"].concat(S.financas.cartoes.map(c=>"Cartão "+c.nome))}
function catCor(n){return corVar(S.financas.catCores[n])}
function mesesEntre(a,b){const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)}
function addMes(ym,n){const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function parcelaNoMes(p,ym){const i=mesesEntre(p.inicio,ym);return i>=0&&i<p.n?i+1:0}
function fimParcela(p){return addMes(p.inicio,p.n-1)}
function nomeMesCurto(ym){const [y,m]=ym.split("-").map(Number);return MESES[m-1].slice(0,3)+"/"+String(y).slice(2)}
function compacto(v){if(!v)return "–";return v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":String(Math.round(v))}
function gastosDoMes(ym){const reais=doMes(S.financas.gastos,ym);const virt=[];S.financas.parcelas.forEach(p=>{const k=parcelaNoMes(p,ym);if(k)virt.push({id:"parc-"+p.id+"-"+k,parcelaId:p.id,virtual:true,valor:p.valor,desc:p.desc+" ("+k+"/"+p.n+")",cat:p.cat,pag:p.pag,data:dataParcela(p,ym)})});return reais.concat(virt)}
function doMes(arr,ym){return arr.filter(x=>mesDe(x.data)===ym)}
function somar(arr){return arr.reduce((a,x)=>a+(+x.valor||0),0)}
const r2=v=>Math.round(v*100)/100;
function saldo(id){return r2(S.financas.movs.filter(m=>m.caixaId===id).reduce((a,m)=>a+(+m.valor||0),0))}
const LIVRE="livre";
function caixaLivre(){return {id:LIVRE,nome:"Não separado",meta:0,livre:true}}
function corCaixa(c){return c.livre?"var(--cc11)":c.corP!=null?corVar(c.corP):"var(--cx"+c.cor+")"}
function totalGuardado(){return r2(saldo(LIVRE)+S.financas.caixinhas.reduce((a,c)=>a+saldo(c.id),0))}
function diasNoMes(ym){return new Date(+ym.slice(0,4),+ym.slice(5),0).getDate()}
function dataParcela(p,ym){return ym+"-"+pad(Math.min(p.dia||1,diasNoMes(ym)))}
function iniciosSalario(){return [...new Set(S.financas.entradas.filter(e=>e.inicia).map(e=>e.data))].sort()}
function modoPeriodo(){const m=S.financas.periodo||"auto";if(m==="custom")return "custom";if(m==="mes")return "mes";return iniciosSalario().length?"salario":(m==="salario"?"salario-vazio":"mes")}
function addMesDia(d,n){const [y,m,dd]=d.split("-").map(Number);const t=new Date(y,m-1+n,1);const ym=t.getFullYear()+"-"+pad(t.getMonth()+1);return ym+"-"+pad(Math.min(dd,diasNoMes(ym)))}
function periodoFin(atual){
  const h=hoje();const m=modoPeriodo();
  if(m==="custom"&&!atual){let a=UI.perIni||mesDe(h)+"-01",b=UI.perFim||h;if(a>b){const t=a;a=b;b=t}return {modo:m,ini:a,fim:b,rot:ddmm(a)+" a "+ddmm(b)}}
  if(m==="salario"){const st=iniciosSalario();let cur=-1;st.forEach((d,k)=>{if(d<=h)cur=k});
    const i=(atual||UI.perIdx==null)?cur:Math.max(-1,Math.min(st.length-1,UI.perIdx));
    if(i<0)return {modo:m,i,n:st.length,ini:atual?mesDe(h)+"-01":"0000-01-01",fim:addDias(st[0],-1),rot:"Antes de "+ddmm(st[0])};
    const ini=st[i],prox=st[i+1],prev=addMesDia(ini,1);
    if(prox)return {modo:m,i,n:st.length,ini,fim:addDias(prox,-1),rot:ddmm(ini)+" a "+ddmm(addDias(prox,-1))};
    return {modo:m,i,n:st.length,ini,fim:h>addDias(prev,-1)?h:addDias(prev,-1),aberto:true,previsto:prev,rot:"Desde "+ddmm(ini)};
  }
  const ym=atual?mesDe(h):UI.mes;return {modo:"mes",ini:ym+"-01",fim:ym+"-"+pad(diasNoMes(ym)),rot:nomeMes(ym),ym};
}
function noPeriodo(arr,per){return arr.filter(x=>x.data>=per.ini&&x.data<=per.fim)}
function gastosNoPeriodo(per){const out=noPeriodo(S.financas.gastos,per);S.financas.parcelas.forEach(p=>{for(let k=1;k<=p.n;k++){const ym=addMes(p.inicio,k-1);const d=dataParcela(p,ym);if(d>per.fim)break;if(d>=per.ini)out.push({id:"parc-"+p.id+"-"+k,parcelaId:p.id,virtual:true,valor:p.valor,desc:p.desc+" ("+k+"/"+p.n+")",cat:p.cat,pag:p.pag,data:d})}});return out}
function guardadoNoPeriodo(per){return r2(S.financas.movs.filter(m=>m.data>=per.ini&&m.data<=per.fim&&!m.par&&!m.fora&&m.desc!=="Saldo inicial").reduce((a,m)=>a+(+m.valor||0),0))}
function navPeriodo(per){

function grafico(pontos,opts){
  opts=opts||{};if(pontos.length<2)return '<div class="empty">Registre pelo menos dois treinos para ver o gráfico.</div>';
  const W=320,H=150,L=38,R=10,T=12,B=24;const ys=pontos.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*.12;mn-=pd;mx+=pd;
  const x=i=>L+(W-L-R)*(i/(pontos.length-1));const y=v=>opts.inverter?T+(H-T-B)*((v-mn)/(mx-mn)):T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g="";for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;const yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+esc(opts.fmt?opts.fmt(v):numF(v))+'</text>'}
  const pts=pontos.map((p,i)=>x(i).toFixed(1)+","+y(p.y).toFixed(1)).join(" ");
  const area="M"+x(0).toFixed(1)+","+(H-B)+" L"+pts.split(" ").join(" L")+" L"+x(pontos.length-1).toFixed(1)+","+(H-B)+" Z";
  const lab=[0,pontos.length-1];if(pontos.length>4)lab.splice(1,0,Math.floor((pontos.length-1)/2));
  let xl="";lab.forEach(i=>{xl+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===pontos.length-1?"end":"middle")+'">'+esc(ddmm(pontos[i].data))+'</text>'});
  const last=pontos.length-1;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de evolução">'+g+'<path d="'+area+'" fill="var(--c)" opacity=".12"/><polyline points="'+pts+'" fill="none" stroke="var(--c)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+pontos.map((p,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="'+(i===last?4.5:2.5)+'" fill="'+(i===last?"var(--c)":"var(--surface)")+'" stroke="var(--c)" stroke-width="1.8"/>').join("")+xl+'</svg>';
}

/* ---------- rotina: hábitos e agenda ---------- */
function difDias(a,b){const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000)}
function ocorreEm(ev,d){if(d<ev.data)return false;const r=ev.rep||"nao";if(r==="nao")return d===ev.data;if(r==="dia")return true;const dd=difDias(ev.data,d);if(r==="semana")return dd%7===0;if(r==="ndias")return dd%Math.max(1,ev.n||1)===0;if(r==="mes")return d.slice(8)===ev.data.slice(8);if(r==="ano")return d.slice(5)===ev.data.slice(5);return false}
function eventosDoDia(d){return S.rotina.eventos.filter(e=>ocorreEm(e,d)).sort((a,b)=>(a.hora||"99")<(b.hora||"99")?-1:(a.hora||"99")>(b.hora||"99")?1:0)}
const EV_TIPOS=[["Trabalho","var(--cc0)"],["Pessoal","var(--cc5)"],["Pagamento","var(--cc2)"],["Saúde","var(--cc3)"],["Estudo","var(--cc7)"],["Outro","var(--cc11)"]];
function evCor(t){const x=EV_TIPOS.find(e=>e[0]===t);return x?x[1]:"var(--cc11)"}
const REPS=[["nao","Não repete"],["dia","Todo dia"],["semana","Toda semana"],["ndias","A cada X dias"],["mes","Todo mês"],["ano","Todo ano"]];
function repTxt(e){const r=e.rep||"nao";if(r==="nao")return "";if(r==="ndias")return "a cada "+(e.n||1)+" dias";return (REPS.find(x=>x[0]===r)||["",""])[1].toLowerCase()}
function habAtivoEm(h,d){return !h.dias||h.dias.length===7||h.dias.includes(parseYmd(d).getDay())}
function seqHab(h){let d=hoje();if(!h.feitos[d])d=addDias(d,-1);let n=0,g=0;while(g++<800){if(h.inicio&&d<h.inicio)break;if(!habAtivoEm(h,d)){d=addDias(d,-1);continue}if(h.feitos[d]){n++;d=addDias(d,-1)}else break}return n}
function taxaHab(h,dias){let tot=0,ok=0;for(let i=0;i<dias;i++){const d=addDias(hoje(),-i);if(h.inicio&&d<h.inicio)break;if(habAtivoEm(h,d)){tot++;if(h.feitos[d])ok++}}return tot?Math.round(ok/tot*100):0}
function anel(pct,cor){const r=26,c=2*Math.PI*r;return '<svg width="68" height="68" viewBox="0 0 68 68" role="img" aria-label="'+pct+'% concluído"><circle cx="34" cy="34" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="7"/><circle cx="34" cy="34" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*pct/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 34 34)"/><text x="34" y="38.5" text-anchor="middle" style="fill:var(--ink);font:700 13px var(--body)">'+pct+'%</text></svg>'}
function linhaHab(h,d){const ativo=habAtivoEm(h,d);return '<div class="item"><button class="check'+(h.feitos[d]?" on":"")+'" style="--c:'+corVar(h.cor)+'" data-act="toggleHab" data-id="'+h.id+'" data-data="'+d+'" aria-label="Marcar '+esc(h.nome)+'"'+(ativo?'':' disabled')+'>'+ICON.ok+'</button><div class="grow tap" data-act="editHab" data-id="'+h.id+'" style="cursor:pointer"><div class="t">'+esc(h.nome)+'</div><div class="d">'+(ativo?seguidos(seqHab(h))+' · '+taxaHab(h,30)+'% em 30 dias':'Não é dia deste hábito')+'</div></div></div>'}
function linhaEv(e,d){const feito=e.feitos&&e.feitos[d];const rt=repTxt(e);const c=evCor(e.tipo);return '<div class="item'+(feito?" evok":"")+'"><button class="check'+(feito?" on":"")+'" style="--c:'+c+'" data-act="toggleEv" data-id="'+e.id+'" data-data="'+d+'" aria-label="Concluir '+esc(e.titulo)+'">'+ICON.ok+'</button><div class="grow tap" data-act="editEv" data-id="'+e.id+'" style="cursor:pointer"><div class="t">'+(e.hora?'<span class="num" style="color:'+c+'">'+esc(e.hora)+'</span> ':'')+esc(e.titulo)+'</div><div class="d"><span style="color:'+c+';font-weight:600">'+esc(e.tipo||"Outro")+'</span>'+(rt?' · '+esc(rt):'')+(e.nota?' · '+esc(e.nota):'')+'</div></div></div>'}

function telaHabitos(){

function usoCartao(c){

/* registro de treino */
function linhaSerie(i,j,s,alvo){return '<div class="setrow"><span class="small muted num">'+(j+1)+'ª</span><input class="in num" inputmode="numeric" placeholder="'+esc(alvo||"reps")+'" aria-label="Repetições" data-r value="'+(s&&s.reps!=null?esc(s.reps):"")+'"><input class="in num" inputmode="decimal" placeholder="kg" aria-label="Carga em kg" data-k value="'+(s&&s.kg!==""&&s.kg!=null?String(s.kg).replace(".",","):"")+'"></div>'}
function blocoEx(i,nome,series,reps,sets,editavelNome){
  const ult=nome?ultimasSeries(nome):null;const n=Math.max(series||3,sets?sets.length:0);
  let rows="";for(let j=0;j<n;j++){const s=sets?sets[j]:(ult&&ult[j]?{reps:"",kg:ult[j].kg}:null);rows+=linhaSerie(i,j,s,reps)}
  return '<div class="exblock" data-ex="'+i+'"><input class="exname" data-nome value="'+esc(nome||"")+'" placeholder="Nome do exercício" aria-label="Exercício"'+(editavelNome?"":"")+'>'+(ult&&!sets?'<div class="small muted num">Última vez: '+ult.map(s=>(s.reps||"–")+"×"+(s.kg!==""&&s.kg!=null?numF(+s.kg):"–")+"kg").join(" · ")+'</div>':'')+
  '<div class="setrow small muted"><span></span><span>Repetições</span><span>Carga (kg)</span></div><div data-sets>'+rows+'</div><button class="btn sm ghost" data-act="addSerie" data-i="'+i+'" data-reps="'+esc(reps||"")+'">+ Série</button></div>';
}
function formRegistro(opts){
  // opts: {item?, data, log?, tipo?}
  const log=opts.log;const item=opts.item;const tipo=log?log.tipo:item?item.tipo:opts.tipo;
  const titulo=log?log.titulo:item?item.titulo:TIPOS[tipo];const data=log?log.data:opts.data;
  let html='<div class="small muted">'+esc(titulo||TIPOS[tipo])+' · '+DIAS_LONGO[parseYmd(data).getDay()]+', '+ddmm(data)+(item&&item.alvo?' · Plano: '+esc(item.alvo):'')+'</div>';
  if(!log&&!item)html+='<label class="f">Tipo<select class="in" id="rTipo" data-change="tipoAvulso">'+Object.entries(TIPOS).map(([k,n])=>'<option value="'+k+'"'+(tipo===k?" selected":"")+'>'+n+'</option>').join("")+'</select></label>';
  if(tipo==="musc"){
    const exs=log?log.exercicios.map(e=>({nome:e.nome,series:e.sets.length,reps:"",sets:e.sets})):item?item.exercicios.map(e=>({nome:e.nome,series:e.series,reps:e.reps})):[{nome:"",series:3,reps:""}];
    html+='<div id="exs" class="stack" style="gap:10px">'+exs.map((e,i)=>blocoEx(i,e.nome,e.series,e.reps,e.sets)).join("")+'</div><button class="btn ghost" data-act="addEx">+ Exercício</button>';
  }else{
    const u=tipo==="corrida"?"km":"metros";
    html+='<div class="grid2"><label class="f">Distância ('+u+')<input class="in num" id="rDist" inputmode="decimal" placeholder="'+(tipo==="corrida"?"5":"1000")+'" value="'+(log&&log.dist?String(log.dist).replace(".",","):"")+'"></label><label class="f">Tempo total<input class="in num" id="rTempo" inputmode="text" placeholder="mm:ss" value="'+(log&&log.tempo?fmtTempo(log.tempo):"")+'"></label></div><div class="small muted">Tempo em minutos:segundos, ou h:mm:ss. O ritmo é calculado sozinho.</div>';
  }
  html+='<label class="f">Observação<input class="in" id="rNota" maxlength="120" placeholder="Opcional" value="'+esc(log&&log.nota||"")+'"></label>';
  if(!log)html+='<label class="f">Data<input class="in" type="date" id="rData" value="'+data+'"></label>';
  html+='<button class="btn block primary" data-act="sheetSave">'+(log?"Salvar alterações":"Concluir treino")+'</button>'+(log?botaoExcluir():"");
  abrir(log?"Treino registrado":"Registrar treino",html,"fis",{noFocus:1,tipo,
    save(){
      const t=log?log.tipo:(document.getElementById("rTipo")?val("rTipo"):tipo);
      const o={id:log?log.id:uid(),tipo:t,titulo:titulo&&titulo!==TIPOS[tipo]?titulo:TIPOS[t],data:log?log.data:(val("rData")||data),nota:val("rNota").trim(),criado:log?log.criado:Date.now()};
      if(item)o.planoId=item.id;else if(log&&log.planoId)o.planoId=log.planoId;
      const recs=[];
      if(t==="musc"){
        o.exercicios=[...document.querySelectorAll(".exblock")].map(b=>{const nome=b.querySelector("[data-nome]").value.trim();const sets=[...b.querySelectorAll("[data-sets] .setrow")].map(r=>{const reps=r.querySelector("[data-r]").value.trim();const kg=parseNum(r.querySelector("[data-k]").value);return {reps:reps?+reps||reps:"",kg:isFinite(kg)?kg:""}}).filter(s=>s.reps!==""||s.kg!=="");return {nome,sets}}).filter(e=>e.nome&&e.sets.length);
        if(!o.exercicios.length){toast("Preencha ao menos uma série");return}
        o.exercicios.forEach(e=>{const prev=historicoEx(e.nome).filter(h=>!log||h.data!==log.data);const pm=Math.max(0,...prev.map(p=>p.max));const m=maxKg(e);if(prev.length&&m>pm)recs.push(e.nome+" "+numF(m)+" kg")});
      }else{
        const d=parseNum(val("rDist")),tm=parseTempo(val("rTempo"));if(!(d>0)||!(tm>0)){toast("Informe distância e tempo");return}
        o.dist=d;o.tempo=tm;
        const prev=S.fisico.logs.filter(l=>l.tipo===t&&l.id!==o.id&&isFinite(ritmo(l)));if(prev.length&&ritmo(o)<Math.min(...prev.map(ritmo)))recs.push("melhor ritmo: "+ritmoTxt(o));
      }
      if(log){const i=S.fisico.logs.findIndex(x=>x.id===log.id);S.fisico.logs[i]=o}else S.fisico.logs.push(o);
      fechar();salvar("fisico");toast(recs.length?"Novo recorde! "+recs.join(", "):"Treino registrado");
    },
    del(){S.fisico.logs=S.fisico.logs.filter(x=>x.id!==log.id);fechar();salvar("fisico");toast("Registro excluído")}
  });
}

  '<button class="btn block primary" data-act="sheetSave">Salvar</button>'+(novo?"":botaoExcluir()),"esp",acoes);
}

    case "perNav":{const per=periodoFin();if(per.modo==="mes"){UI.mes=addMes(UI.mes,+v)}else if(per.modo==="salario"){UI.perIdx=Math.max(-1,Math.min(per.n-1,per.i+(+v)))}render();break}
    case "perModo":{const per=periodoFin();S.financas.periodo=v;UI.perIdx=null;if(v==="custom"&&!UI.perIni){UI.perIni=per.ini<"1000"?mesDe(hoje())+"-01":per.ini;UI.perFim=per.fim}if(v==="mes")UI.mes=mesDe(hoje());salvar("financas");break}
    case "instalar":if(promptInstalar){promptInstalar.prompt();promptInstalar.userChoice.finally(()=>{promptInstalar=null;render()})}break;
    case "semInstalar":gravarLS(KEY+"-semInstalar",hoje());render();break;
    case "baixarBkp":{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="te-engrena-copia-"+hoje()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);marcarCopia();toast("Cópia salva. Guarde o arquivo num lugar seguro, como o Google Drive.");render()}catch(e){toast("Não deu para salvar o arquivo. Use Copiar como texto.")}break}
    case "copiarBkp":{marcarCopia();const t=document.getElementById("bkp");const txt=t.value;const ok=()=>toast("Cópia copiada. Cole numa nota e guarde.");try{navigator.clipboard.writeText(txt).then(ok,()=>{t.select();toast("Texto selecionado. Toque em Copiar.")})}catch(e){t.select();toast("Texto selecionado. Toque em Copiar.")}break}
    case "restaurar":{let j;try{j=JSON.parse(val("rest"))}catch(e){toast("O texto colado não é uma cópia válida");return}if(!j||!j.fisico||!j.financas||!j.espiritual){toast("O texto colado não é uma cópia válida");return}
      if(!restArmado){restArmado=true;el.textContent="Toque de novo para substituir tudo";return}
      PARTS.forEach(p=>{S[p]=normaliza(p,j[p])});restArmado=false;PARTS.forEach(p=>salvar(p));toast("Dados restaurados");break}
  }
  if(a==="toggleHab"||a==="toggleEv"||a==="toggleMeta"){
    let sel='[data-act="'+a+'"][data-id="'+id+'"]';if(el.dataset.data)sel+='[data-data="'+el.dataset.data+'"]';
    document.querySelectorAll(sel).forEach(b=>{b.classList.add("pop");if(b.classList.contains("on"))vibrar(12)});
  }else if(a==="pick"||a==="pickCor"||a==="toggleDiaHab"||a==="pickDv"){el.classList.add("pop")}
  else if(a==="sheetSave")vibrar(8);
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="perIni"||ev.target.id==="perFim"){UI.perIni=val("perIni");UI.perFim=val("perFim");render();return}
  if(ev.target.id==="restArq"&&ev.target.files&&ev.target.files[0]){const fr=new FileReader();fr.onload=()=>{const t=document.getElementById("rest");if(t)t.value=String(fr.result||"");toast("Arquivo carregado. Toque em Restaurar cópia.")};fr.readAsText(ev.target.files[0]);return}
  const el=ev.target;const c=el.dataset&&el.dataset.change;if(!c)return;
  if(c==="evo"){UI.evo=el.value;render()}
  if(c==="tipoAtiv"){document.getElementById("boxEx").hidden=el.value!=="musc";document.getElementById("boxAlvo").hidden=el.value==="musc"}
  if(c==="kMes"){const cc=SH&&SH.card;const x=cc&&cc.faturas?cc.faturas[el.value]:null;document.getElementById("kF").value=x!=null?fmtIn(x):""}
  if(c==="evRep"){const l=document.getElementById("evNl");if(l)l.hidden=el.value!=="ndias"}
  if(c==="mvTipo"){const b=document.getElementById("mvDest");if(b)b.hidden=el.value!=="trf";const a=document.getElementById("mvAju");if(a)a.hidden=el.value!=="aju";const l=document.getElementById("mvVl");if(l)l.firstChild.textContent=el.value==="aju"?"Saldo correto (R$)":"Valor (R$)"}
  if(c==="tipoAvulso"){const d=val("rData")||hoje();formRegistro({data:d,tipo:el.value})}
});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset&&t.dataset.corlivre){const g=t.dataset.corlivre;const hd=document.getElementById(g);if(hd)hd.value=t.value;const lb=t.closest(".corlivre");if(lb){lb.classList.add("on");lb.querySelector(".corprev").style.setProperty("--c",t.value);const gr=lb.previousElementSibling;if(gr)gr.querySelectorAll(".cor").forEach(b=>{b.classList.remove("on");b.setAttribute("aria-checked","false")})}return}if(t.id==="notaBusca"){UI.notaBusca=t.value;const pos=t.selectionStart;render();const n=document.getElementById("notaBusca");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}return}if(t.id==="dvT"||(t.dataset&&t.dataset.dv))atualizaDiv();if(t.id==="pV"||t.id==="pN"||t.id==="pI")atualizaParc()});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&SH)fechar();
  if(ev.key==="Enter"&&ev.target.id==="gratHoje"){ev.preventDefault();document.querySelector('[data-act="addGratHoje"]').click()}
});

render();
iniciaSync();
let diaAtual=hoje();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&hoje()!==diaAtual){diaAtual=hoje();if(!SH)render()}});
setInterval(()=>{if(hoje()!==diaAtual){diaAtual=hoje();if(!SH)render()}},60000);
})();
</script>
